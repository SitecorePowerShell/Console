Path: /sitecore/system/Modules/PowerShell/Script Library/SPE/Reporting/Content Reports/Reports/Content Audit/Recent workflow history
SharedFields:
- ID: "06d5295c-ed2f-4a54-9bf2-26228d113318"
  Hint: __Icon
  Value: Office/32x32/arrow_fork2.png
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    <#
        .SYNOPSIS
            Lists the workflow history of an item or a branch, newest first,
            in every language and version, including versions removed since.
    #>
    Import-Function -Name Invoke-SqlCommand
    
    function Get-StateName {
        param([string]$StateId)
    
        if(-not $StateId) { return }
        $state = Get-Item -Path "master:" -ID $StateId -ErrorAction SilentlyContinue
        if($state) { $state.Name } else { $StateId }
    }
    
    function Get-WorkflowComment {
        param([string]$Text)
    
        # Comment fields are stored as JSON, entries from older Sitecore versions as plain text
        if(-not $Text.StartsWith("[")) { return $Text }
        try { $fields = ConvertFrom-Json -InputObject $Text } catch { return $Text }
        @(foreach($field in $fields) {
            if($field.Key -eq "Comments") { $field.Value } else { "$($field.Key): $($field.Value)" }
        }) -join "; "
    }
    
    # Fields Sitecore sets on save, lock and workflow moves rather than editors
    $bookkeepingFields = @("__Created", "__Created by", "__Updated", "__Updated by", "__Revision", "__Lock", "__Workflow", "__Workflow state")
    
    function Get-ChangedFields {
        param([hashtable]$Versions, [int]$Number)
    
        # Sitecore keeps no record of what a submit changed, so compare the version with the one before it
        $version = $Versions[$Number]
        if(-not $version) { return "" }
        if($Number -eq 1) { return "(first version)" }
        $previous = $Versions[$Number - 1]
        if(-not $previous) { return "(previous version removed)" }
        $version.Fields.ReadAll()
        $changed = @($version.Fields | Where-Object { $bookkeepingFields -notcontains $_.Name -and $_.Value -cne $previous.Fields[$_.ID].Value } | ForEach-Object { $_.Name })
        if($changed) { $changed -join ", " } else { "(no changes)" }
    }
    
    $database = Get-Database -Name "master"
    $root = Get-Item -Path (@{$true="master:\content\home"; $false="master:\content"}[(Test-Path -Path "master:\content\home")])
    $includeDescendants = $false
    $limitPeriod = $false
    $fromDate = [datetime]::Today.AddDays(-14)
    $toDate = [datetime]::Now
    
    $settings = @{
        Title = "Report Filter"
        OkButtonName = "Proceed"
        CancelButtonName = "Abort"
        Description = "Show the workflow history of an item or a branch."
        Parameters = @(
            @{ Name = "root"; Title = "Item"; Tooltip = "The item to show the workflow history for." },
            @{ Name = "includeDescendants"; Title = "Include descendants"; Tooltip = "Also show the history of every item under the selected one."; Editor = "checkbox" },
            @{ Name = "limitPeriod"; Title = "Limit to a period"; Tooltip = "Only show history recorded within the period."; Editor = "checkbox"; GroupId = 1 },
            @{ Name = "fromDate"; Title = "From"; Editor = "date time"; Columns = 6; ParentGroupId = 1; HideOnValue = "0" },
            @{ Name = "toDate"; Title = "To"; Editor = "date time"; Columns = 6; ParentGroupId = 1; HideOnValue = "0" }
        )
        Icon = [regex]::Replace($PSScript.Appearance.Icon, "Office", "OfficeWhite", [System.Text.RegularExpressions.RegexOptions]::IgnoreCase)
        ShowHint = $true
    }
    
    $result = Read-Variable @settings
    if($result -ne "ok") {
        Exit
    }
    
    $items = @($root)
    $scope = $root.Paths.Path
    if($includeDescendants) {
        $items += @($root.Axes.GetDescendants())
        $scope += " and its descendants"
    }
    $itemsById = @{}
    $items | ForEach-Object { $itemsById["$($_.ID.Guid)"] = $_ }
    
    # Read from SQL rather than Get-ItemWorkflowEvent to include versions that no longer exist
    $query = "SELECT ItemID, Language, Version, OldState, NewState, Text, [User], Date FROM WorkflowHistory WHERE ItemID IN ({0})"
    $parameters = @{}
    $period = ""
    if($limitPeriod) {
        $query += " AND Date BETWEEN @from AND @to"
        # History dates are stored in UTC
        $parameters = @{
            "from" = [Sitecore.DateUtil]::ToUniversalTime($fromDate)
            "to" = [Sitecore.DateUtil]::ToUniversalTime($toDate)
        }
        $period = " between $fromDate and $toDate"
    }
    
    $connection = [Sitecore.Configuration.Settings]::GetConnectionString($database.Name)
    $ids = @($itemsById.Keys | ForEach-Object { "'$_'" })
    # Batched so large branches don't produce an oversized IN list
    $history = @(for($i = 0; $i -lt $ids.Count; $i += 1000) {
        Write-Progress -Activity "Reading workflow history" -Status "$i of $($ids.Count) items" -PercentComplete ($i * 100 / $ids.Count)
        $batch = $ids[$i..([math]::Min($i + 999, $ids.Count - 1))] -join ","
        Invoke-SqlCommand -Connection $connection -Query ($query -f $batch) -Parameters $parameters
    })
    
    $versions = @{}
    $changes = @{}
    $processed = 0
    $reportItems = foreach($entry in $history) {
        $processed++
        Write-Progress -Activity "Analysing workflow history" -Status "$processed of $($history.Count) entries" -PercentComplete ($processed * 100 / $history.Count)
        $item = $itemsById["$($entry.ItemID)"]
        $key = "$($entry.ItemID)|$($entry.Language)"
        if(-not $versions.ContainsKey($key)) {
            $versions[$key] = @{}
            Get-Item -Path "master:" -ID $item.ID -Language $entry.Language -Version * -ErrorAction SilentlyContinue | ForEach-Object { $versions[$key][$_.Version.Number] = $_ }
        }
        $versionKey = "$key|$($entry.Version)"
        if(-not $changes.ContainsKey($versionKey)) {
            $changes[$versionKey] = Get-ChangedFields $versions[$key] $entry.Version
        }
    
        [pscustomobject]@{
            "Icon" = $item.Appearance.Icon
            "Name" = $item.Name
            "Language" = $entry.Language
            "Version" = $entry.Version
            "VersionExists" = $versions[$key].ContainsKey([int]$entry.Version)
            "Date" = [Sitecore.DateUtil]::ToServerTime([datetime]::SpecifyKind($entry.Date, [System.DateTimeKind]::Utc))
            "OldState" = Get-StateName $entry.OldState
            "NewState" = Get-StateName $entry.NewState
            "User" = $entry.User
            "Comments" = Get-WorkflowComment $entry.Text
            "ChangedFields" = $changes[$versionKey]
            "Path" = $item.Paths.Path
            "ID" = $item.ID
        }
    }
    Write-Progress -Activity "Analysing workflow history" -Completed
    
    if(-not $reportItems) {
        Show-Alert "There is no workflow history for $scope$period."
    } else {
        $reportProperties = @{
            Property = @("Icon","Name","Language","Version","VersionExists","Date","OldState","NewState","User","Comments","ChangedFields","Path")
            Title = "Workflow history"
            InfoTitle = "Workflow history"
            InfoDescription = "Workflow history of $scope$period, newest first. VersionExists is False for versions removed since. ChangedFields compares each version with the one before it."
        }
        $reportItems | Sort-Object -Property Date -Descending | Show-ListView @reportProperties
    }
    
    Close-Window
